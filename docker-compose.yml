version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remote-browser-backend
    restart: always
    network_mode: "host"
    volumes:
      # Allows backend to start chromium containers on the host machine
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3001
      - USE_LOCAL_PUPPETEER=false
      - CHROMIUM_HOST=127.0.0.1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
# Environment variables VITE_API_URL and VITE_WS_URL are omitted to let the client automatically resolve connections using the host's IP/domain dynamically.
    container_name: remote-browser-frontend
    restart: always
    ports:
      - "80:80"
